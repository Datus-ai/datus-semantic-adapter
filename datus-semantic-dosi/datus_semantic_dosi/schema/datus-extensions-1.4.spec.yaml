# Prompt-facing authoring contract for DATUS custom_extensions. This file
# complements the OSI core spec; the native Dosi parser/compiler is authoritative.

spec:
  vendor_name: DATUS
  extension_version: "1.4"
  minimum_supported_version: "1.0"
  osi_core_version: 0.2.0.dev0

envelope:
  shape:
    vendor_name: DATUS
    data: JSON string encoding one object
  keys:
    v: {type: string, generated_value: "1.4", required_for_generated_payloads: true}
    requires:
      type: "array[string]"
      required: false
      purpose: Reject consumers that would silently ignore a listed capability key and return wrong results.
      generated_value: Include "measure" exactly when the payload contains the measure key; otherwise omit it.
  rules:
    - Use at most one DATUS entry on an OSI object.
    - A version applies only to its own entry and is not inherited.
    - Ignore impact describes the result of a consumer not honoring a capability key; `silent` means it would return undetectably wrong results.
    - List a key in `requires` only when its capability metadata declares silent ignore impact.
    - Put each extension key only on one of its declared carriers below.

carriers:
  dataset:
    time_dimension:
      type: string
      reference: time field in this dataset
      rule: The field exists and has dimension.is_time set to true.
      default: Infer the only time field; zero or multiple time fields remain unresolved.

  field:
    time_granularity:
      type: "enum[day, week, month, quarter, year]"
      rule: The carrying field has dimension.is_time set to true.

  relationship:
    join_type:
      type: "enum[left, inner]"
      default: left

  metric:
    dataset:
      type: string
      purpose: Attribute an otherwise unattributable aggregate such as COUNT(*).
      rule: It cannot override attribution established by the metric expression.
    time_dimension:
      type: string
      reference: field or qualified dataset.field
      default: Resolve the unique primary time dimension among the metric datasets.
    fill_nulls_with:
      type: finite number
      default: Bare counts fill with 0; other metrics retain null.
      rule: Window outputs retain semantic nulls such as a missing comparison bucket.
    window:
      type: object
      schema: structured_window below
    derive:
      type: object
      schema: structured_derive below
    measure:
      type: object
      schema: explicit_measure below

  metric_metadata:
    subject_path: {type: "array[string]"}
    unit: {type: string}
    format: {type: string}

structured_window:
  base:
    shape: {base: metric name}
    required: false
    rules:
      - The base may reference a plain leaf metric or a filter-derived metric in the same semantic model.
      - A window metric is invalid as a base; a compose base is not implemented.
      - With base, the metric expression is the closest basic-mode approximation and may diverge from Datus-mode window semantics.
  base_metric:
    expression: one plain single aggregate over dataset fields
    examples: [SUM(orders.amount), COUNT(*), AVG(reviews.score)]
    rules:
      - Without base, a ratio or arithmetic expression metric cannot carry a window.
      - Time-ordered windows resolve time from metric time_dimension, then dataset primary time.
      - A covariance or correlation second input names another plain aggregate metric.
      - Choose one sugar form or exactly one general family among offset, frame, rank, and value.

  enums:
    granularity: [day, week, month, quarter, year]
    calculation: [value, delta, percent_change, ratio]
    one_input_function: [sum, avg, min, max, count, stddev_pop, stddev_samp, var_pop, var_samp]
    two_input_function: [covar_pop, covar_samp, corr]
    rank_function: [row_number, rank, dense_rank, ntile, percent_rank, cume_dist]
    value_function: [first_value, last_value, nth_value]
    order_by: [time, value]
    direction: [asc, desc]
    partition_mode: [query_dimensions, query_dimensions_except, time_bucket, none]
    frame_units: [rows, range]
    reset: [week, month, quarter, year]

  forms:
    offset:
      shape:
        offset: {count: integer >= 1, granularity: granularity, direction: back|forward = back}
        calculation: calculation
      required: [offset, calculation]

    pop:
      shape:
        type: pop
        offset: "'<positive integer> <granularity>' or offset object"
        calculation: calculation = percent_change
      required: [type, offset]

    rolling:
      shape:
        type: rolling
        function: one_input_function
        periods: integer >= 1, including the current bucket
        require_full_window: boolean = false
      required: [type, function, periods]

    cumulative:
      shape:
        type: cumulative
        function: one_input_function
        reset: reset or absent for no reset
      required: [type, function]

    frame:
      shape:
        frame:
          function: one_input_function or two_input_function
          preceding: non-negative integer or unbounded
          second: metric name, required only for a two_input_function
          reset: reset
          require_full_window: boolean = false
          order: order
          partition: partition
          units: frame_units = rows
      required: [frame.function, frame.preceding]
      rules:
        - "`second` is present only for a two-input function."
        - "`require_full_window` needs finite preceding and units rows."
        - "`reset` cannot be combined with order.by value."
        - Units range requires unbounded preceding and order.by value.

    rank:
      shape:
        rank:
          function: rank_function
          buckets: integer >= 1, required only for ntile
          order: "order = {by: value, direction: desc}"
          partition: "partition = {mode: none}"
      required: [rank.function]

    value:
      shape:
        value:
          function: value_function
          n: integer >= 1, required only for nth_value
          order: "order = {by: time, direction: asc}"
          partition: "partition = {mode: query_dimensions}"
      required: [value.function]

  shared:
    order:
      shape: {by: order_by, direction: direction}
      defaults: {time: asc, value: desc}
    partition:
      shape: {mode: partition_mode, exclude: "array[qualified dataset.field]"}
      rule: "`exclude` is non-empty only for query_dimensions_except and absent otherwise."

structured_derive:
  purpose: Describe a metric derived from other metrics in the same semantic model.
  expression_contract:
    - Keep a legal OSI expression as a basic-mode fallback.
    - Filter and compose over leaf/filter members are flatten-tier forms; their fallback expression must be semantically equivalent to the derive expansion.
    - Window.base and compose with window members are stage-tier forms; their fallback expression is the closest basic-mode approximation and may diverge after DATUS extensions are ignored.
    - Treat the fallback expression as tool-maintained output rather than editing it independently.
  common_rules:
    - Version 1.4 supports only filter and compose.
    - Filter base references are single-hop and must name a plain non-derived metric in the same semantic model.
    - Compose members may be leaves, filters, or windows in the same semantic model, but never another compose.
    - Cycles among metric references are invalid.
    - The reserved reagg family must not be authored until its later milestone is implemented.
  families:
    filter:
      shape:
        type: filter
        base: metric name
        where: SQL predicate
      required: [type, base, where]
      rules:
        - The base must contain exactly one plain aggregate.
        - The predicate may reference only fields from the base measure dataset in version 1.4.
        - The predicate cannot contain aggregates, subqueries, or window functions.
        - The predicate is folded into the aggregate argument with CASE WHEN; it is not applied as a row-removing WHERE clause.
    compose:
      shape:
        type: compose
        expr: scalar arithmetic over metric names
        fill: optional finite number
      required: [type, expr]
      rules:
        - Every identifier in expr resolves strictly to a metric name; it never falls back to a field name.
        - The expression must reference at least one metric and cannot contain aggregate functions.
        - A compose containing window members runs over window outputs and requires one shared time axis.
        - fill applies to each aligned member value after branch alignment and before arithmetic; without it, null propagates.
        - Query dimensions must be conformed across every member branch.

explicit_measure:
  shape:
    name: non-empty string
  required: [name]
  rules:
    - Use only on a metric whose expression contains exactly one aggregate.
    - The name labels the synthesized measure; aggregate deduplication still uses the aggregate signature.
    - Names remain subject to model-wide collision checks.
    - Whenever measure is present, include "measure" in the envelope requires array because older engines would silently rename the result.

examples:
  dataset_and_time_field:
    name: orders
    source: analytics.orders
    custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.4","time_dimension":"order_date"}'
    fields:
      - name: order_date
        expression: {dialects: [{dialect: __OSI_DIALECT__, expression: order_date}]}
        dimension: {is_time: true}
        custom_extensions:
          - vendor_name: DATUS
            data: '{"v":"1.4","time_granularity":"day"}'

  base_metric:
    name: order_count
    expression: {dialects: [{dialect: __OSI_DIALECT__, expression: COUNT(*)}]}
    custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.4","dataset":"orders","subject_path":["sales","orders","count"]}'

  window_metric:
    name: revenue_mom_growth
    expression: {dialects: [{dialect: __OSI_DIALECT__, expression: SUM(orders.amount)}]}
    custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.4","time_dimension":"orders.order_date","window":{"type":"pop","offset":"1 month","calculation":"percent_change"}}'

  filtered_metric:
    name: new_user_revenue
    expression: {dialects: [{dialect: __OSI_DIALECT__, expression: "SUM(CASE WHEN orders.is_new THEN orders.amount END)"}]}
    custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.4","derive":{"type":"filter","base":"revenue","where":"orders.is_new = true"}}'

  composed_metric:
    name: net_revenue
    expression: {dialects: [{dialect: __OSI_DIALECT__, expression: "COALESCE(SUM(orders.amount), 0) - COALESCE(SUM(refunds.amount), 0)"}]}
    custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.4","derive":{"type":"compose","expr":"revenue - total_refunds","fill":0}}'

  window_over_filter_metric:
    name: new_user_revenue_cumulative
    expression: {dialects: [{dialect: __OSI_DIALECT__, expression: "SUM(CASE WHEN orders.is_new THEN orders.amount END)"}]}
    custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.4","window":{"type":"cumulative","function":"sum","base":"new_user_revenue"}}'

  composed_window_metric:
    name: cumulative_average_order_value
    expression: {dialects: [{dialect: __OSI_DIALECT__, expression: "SUM(orders.amount) / COUNT(orders.order_id)"}]}
    custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.4","derive":{"type":"compose","expr":"revenue_cumulative / order_count_cumulative"}}'

  explicitly_named_measure:
    name: new_product_revenue
    expression: {dialects: [{dialect: __OSI_DIALECT__, expression: "SUM(CASE WHEN orders.category = 'new' THEN orders.amount END)"}]}
    custom_extensions:
      - vendor_name: DATUS
        data: '{"v":"1.4","requires":["measure"],"measure":{"name":"orders_new_product_amount_sum"}}'

  additional_window_payloads:
    - '{"v":"1.4","window":{"offset":{"count":1,"granularity":"month","direction":"forward"},"calculation":"value"}}'
    - '{"v":"1.4","window":{"frame":{"function":"corr","preceding":"unbounded","second":"quantity_total"}}}'
    - '{"v":"1.4","window":{"rank":{"function":"rank","partition":{"mode":"query_dimensions_except","exclude":["orders.region"]}}}}'
    - '{"v":"1.4","window":{"value":{"function":"nth_value","n":2}}}'
