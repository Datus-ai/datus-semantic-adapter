# Tutorial-sized OSI model used across Dosi tests:
# one fact table (orders), two dimensions (customers, products),
# a time dimension, and one metric of each inferable kind.

version: "0.2.0.dev0"

semantic_model:
  - name: orders_model
    description: Minimal e-commerce model for engine tests
    datasets:
      - name: orders
        source: main.orders
        primary_key: [order_id]
        fields:
          - name: order_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: order_id
          - name: customer_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: customer_id
          - name: product_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: product_id
          - name: order_date
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: order_date
            dimension:
              is_time: true
            custom_extensions:
              - vendor_name: DATUS
                data: '{"v":"1.2","time_granularity":"day"}'
          - name: status
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: status
          - name: amount
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: amount

      - name: customers
        source: main.customers
        primary_key: [customer_id]
        fields:
          - name: customer_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: customer_id
          - name: region
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: region
          - name: signup_date
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: signup_date
            dimension:
              is_time: true

      - name: products
        source: main.products
        primary_key: [product_id]
        fields:
          - name: product_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: product_id
          - name: category
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: category
          - name: unit_cost
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: unit_cost

    relationships:
      - name: orders_to_customers
        from: orders
        to: customers
        from_columns: [customer_id]
        to_columns: [customer_id]
      - name: orders_to_products
        from: orders
        to: products
        from_columns: [product_id]
        to_columns: [product_id]

    metrics:
      - name: revenue
        description: Total order amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(orders.amount)
      - name: order_count
        description: Number of orders
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: COUNT(orders.order_id)
      - name: unique_customers
        description: Distinct purchasing customers
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: COUNT(DISTINCT orders.customer_id)
      - name: avg_order_value
        description: Revenue per order (ratio)
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(orders.amount) / COUNT(orders.order_id)
      - name: total_margin
        description: Revenue minus cost (expression over two aggregates)
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(orders.amount) - SUM(products.unit_cost)
      - name: running_revenue
        description: Running revenue by query time bucket
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(orders.amount)
        custom_extensions:
          - vendor_name: DATUS
            data: '{"v":"1.2","window":{"type":"cumulative","function":"sum"}}'
      - name: rolling_2m_avg_revenue
        description: Average monthly revenue over the current and previous month
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(orders.amount)
        custom_extensions:
          - vendor_name: DATUS
            data: '{"v":"1.2","window":{"type":"rolling","function":"avg","periods":2}}'
      - name: revenue_mom_growth
        description: Month-over-month revenue growth rate
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(orders.amount)
        custom_extensions:
          - vendor_name: DATUS
            data: '{"v":"1.2","window":{"type":"pop","offset":"1 month"}}'
      - name: monthly_running_revenue
        description: Running revenue reset each month
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(orders.amount)
        custom_extensions:
          - vendor_name: DATUS
            data: '{"v":"1.3","window":{"type":"cumulative","function":"sum","reset":"month"}}'
      - name: monthly_revenue_rank
        description: Revenue rank partitioned by query time bucket
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(orders.amount)
        custom_extensions:
          - vendor_name: DATUS
            data: '{"v":"1.3","window":{"rank":{"function":"rank","partition":{"mode":"time_bucket"}}}}'
